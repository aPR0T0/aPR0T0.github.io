<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>Specimen-current board: onboard detector power with grounded direct readout</title><desc>The regulated12/24V input powers a5V buck then an isolated±9V converter and quiet±5V regulators. Secondary common is deliberately bonded to PGND. The insulated specimen connects to SUM, the amplifier and ADC, then direct I2C to the grounded ESP32. Chamber and shields connect to the ground star.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#efc783" stroke-width="1.5"/></marker><marker id="s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#9bddc6" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e7efea;font-size:14px}.tiny{font-size:11px;fill:#b6c9c0}.label{font-size:11px;letter-spacing:1.2px;fill:#b6c9c0}.b{font-size:16px;font-weight:700}.p{stroke:#efc783;stroke-width:2;fill:none;marker-end:url(#a)}.s{stroke:#9bddc6;stroke-width:2;fill:none;marker-end:url(#s)}.control{stroke:#b6c9c0;stroke-width:1.5;fill:none;stroke-dasharray:4 4;marker-end:url(#s)}</style><rect width="960" height="480" rx="12" fill="#142d30"/><rect x="20" y="45" width="920" height="402" rx="9" fill="#1c3b3c"/><text x="40" y="30" class="label">ONE GROUNDED REFERENCE · PGND / AGND BONDED</text><rect x="40" y="90" width="172" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="54" y="115" class="b">12 / 24 V</text><text x="54" y="135" class="tiny">J2 · fuse / diode</text><rect x="257" y="90" width="175" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="271" y="115" class="b">5 V buck</text><text x="271" y="135" class="tiny">LMR51420 · ~5.09 V</text><rect x="477" y="90" width="197" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="491" y="115" class="b">Isolated ±9 V</text><text x="491" y="135" class="tiny">R05P09D/P · common bonded</text><rect x="720" y="90" width="196" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="734" y="115" class="b">Quiet local rails</text><text x="734" y="135" class="tiny">RC → ±5 V / ADC 3.3 V</text><path d="M212 122H255" class="p" /><path d="M432 122H475" class="p" /><path d="M674 122H718" class="p" /><rect x="40" y="252" width="214" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="54" y="277" class="b">Insulated specimen</text><text x="54" y="297" class="tiny">Feedthrough centre → J1.1 SUM</text><rect x="345" y="252" width="287" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="359" y="277" class="b">LMC662 → ADS1115</text><text x="359" y="297" class="tiny">100 MΩ / 10 pF · differential ADC</text><rect x="719" y="252" width="197" height="65" rx="7" fill="#284744" stroke="#5c8076"/><text x="733" y="277" class="b">Grounded ESP32</text><text x="733" y="297" class="tiny">J3 SDA / SCL · 3.3 V I²C</text><path d="M254 284H343" class="s" /><path d="M632 284H717" class="s" /><path d="M817 155V203H490V250" class="p" /><text x="549" y="223" class="tiny">Detector power only</text><path d="M40 384H916" stroke="#a9bba6" stroke-width="2"/><text x="40" y="371" class="label">J4 PGND: chamber / enclosure star · J1.2 AGND: input guard</text><text x="40" y="415" class="tiny">Only the specimen holder is insulated from the stage. A second ground wire to it would bypass the measured current.</text></svg>