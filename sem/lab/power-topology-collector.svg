<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"><title>Collector board: branched onboard power and isolated readout</title><desc>A grounded12/24V input powers a5V buck. Its5V bus independently powers the isolated±9V converter and the grounded CA02P bias module. Floating regulators, amplifier, ADC and local MCU reference FCOM. Two optocouplers carry requests and readings between the grounded ESP32 and local MCU. Filtered HV raises FCOM; collector connects only to SUM.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#efc783" stroke-width="1.5"/></marker><marker id="s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#9bddc6" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e7efea;font-size:14px}.tiny{font-size:11px;fill:#b6c9c0}.label{font-size:11px;letter-spacing:1.2px;fill:#b6c9c0}.b{font-size:16px;font-weight:700}.p{stroke:#efc783;stroke-width:2;fill:none;marker-end:url(#a)}.s{stroke:#9bddc6;stroke-width:2;fill:none;marker-end:url(#s)}.control{stroke:#b6c9c0;stroke-width:1.5;fill:none;stroke-dasharray:4 4;marker-end:url(#s)}</style><rect width="960" height="480" rx="12" fill="#142d30"/><rect x="20" y="42" width="394" height="408" rx="9" fill="#1a393b"/><rect x="568" y="42" width="372" height="408" rx="9" fill="#244238"/><path d="M490 48V443" stroke="#93ab9c" stroke-dasharray="5 7"/><text x="38" y="30" class="label">GROUNDED SIDE · PGND</text><text x="586" y="30" class="label">FLOATING SIDE · FCOM</text><text x="440" y="468" class="tiny">insulation boundary</text><rect x="40" y="95" width="122" height="62" rx="7" fill="#284744" stroke="#5c8076"/><text x="54" y="120" class="b">12 / 24 V</text><text x="54" y="140" class="tiny">J2 · fuse / diode</text><rect x="206" y="95" width="177" height="62" rx="7" fill="#284744" stroke="#5c8076"/><text x="220" y="120" class="b">5 V buck</text><text x="220" y="140" class="tiny">LMR51420 · ~5.09 V</text><rect x="424" y="95" width="131" height="62" rx="7" fill="#425b50" stroke="#5c8076"/><text x="438" y="120" class="b">Isolated DC/DC</text><text x="438" y="140" class="tiny">R05P09D/P</text><rect x="608" y="95" width="300" height="62" rx="7" fill="#284744" stroke="#5c8076"/><text x="622" y="120" class="b">Quiet local rails</text><text x="622" y="140" class="tiny">±9 V → RC → ±5 V / 3.3 V</text><path d="M162 126H204" class="p" /><path d="M383 126H422" class="p" /><path d="M555 126H606" class="p" /><rect x="40" y="238" width="243" height="64" rx="7" fill="#284744" stroke="#5c8076"/><text x="54" y="263" class="b">Grounded scan ESP32</text><text x="54" y="283" class="tiny">J3 · UART / VIO / controls / fault</text><rect x="424" y="228" width="131" height="84" rx="7" fill="#425b50" stroke="#5c8076"/><text x="438" y="253" class="b">2 × optocoupler</text><text x="438" y="273" class="tiny">VO2611-X016</text><rect x="608" y="238" width="300" height="64" rx="7" fill="#284744" stroke="#5c8076"/><text x="622" y="263" class="b">LMC662 → ADC → MCU</text><text x="622" y="283" class="tiny">SUM → current readout → local UART</text><path d="M754 157V236" class="p" /><text x="608" y="213" class="tiny">Collector → J1.1 SUM; guard → J1.2 FCOM</text><path d="M283 254H422" class="s" /><path d="M555 254H606" class="s" /><path d="M608 286H557" class="s" /><path d="M424 286H285" class="s" /><text x="320" y="244" class="tiny">request</text><text x="320" y="306" class="tiny">reading</text><rect x="206" y="358" width="177" height="62" rx="7" fill="#284744" stroke="#5c8076"/><text x="220" y="383" class="b">CA02P-5</text><text x="220" y="403" class="tiny">0–200 V · onboard</text><rect x="424" y="358" width="131" height="62" rx="7" fill="#425b50" stroke="#5c8076"/><text x="438" y="383" class="b">Bias RC filter</text><text x="438" y="403" class="tiny">10k / 10k + C</text><rect x="217" y="179" width="166" height="48" rx="7" fill="#284744" stroke="#5c8076"/><text x="231" y="204" class="b">Limit / latch off</text><text x="231" y="224" class="tiny">TPS2553-1</text><path d="M294 157V177" class="p" /><path d="M294 227V356" class="p" /><path d="M217 203H116V236" class="s" /><text x="40" y="194" class="tiny">fault → GPIO34</text><rect x="40" y="358" width="140" height="62" rx="7" fill="#284744" stroke="#5c8076"/><text x="54" y="383" class="b">Actual 5 V check</text><text x="54" y="403" class="tiny">G50 · 180–420 ms</text><path d="M180 389H204" class="control" /><path d="M160 302V335H236V356" class="control" /><text x="40" y="341" class="tiny">GPIO32 / GPIO33</text><path d="M383 389H422" class="p" /><path d="M555 389H607" class="p" /><text x="608" y="382" class="b">FCOM ≈ +199.6 V</text><text x="608" y="403" class="tiny">Local common + inner guard; not SUM</text><text x="40" y="439" class="tiny">Chamber · specimen · outer shield → earth</text><text x="608" y="439" class="tiny">No grounded USB / probe / programmer here</text></svg>